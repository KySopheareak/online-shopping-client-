<div class="contain">
  <div class="navbar">
    <div class="logo" (click)="onReloadPage()">
      <strong>Shopping</strong>
    </div>
    <input class="search-bar" type="text" placeholder="Search for products" [formControl]="searchCtrl"
      (keydown.space)="$event.stopPropagation()" (keydown.enter)="$event.stopPropagation()" />
    <mat-icon class="search-icon">search</mat-icon>
    <div class="nav-item">
      <div class="title" [matMenuTriggerFor]="menu">
        <strong>Category</strong>
      </div>
      <div class="title">
        <strong>Service</strong>
      </div>
      <div class="title">
        <strong>About</strong>
      </div>
      <div style="position: relative; display: inline-block;" (click)="onBuy()">
        <mat-icon>shopping_cart</mat-icon>
        <span *ngIf="totalCartCount > 0" class="cart-badge">{{ totalCartCount }}</span>
      </div>
      <mat-icon [matMenuTriggerFor]="menu">more_vert</mat-icon>
      <mat-menu #menu="matMenu">
        <button mat-menu-item (click)="onLogout()">
          <mat-icon>logout</mat-icon>
          <span>Logout</span>
        </button>
      </mat-menu>
    </div>
  </div>
  @if (products.length === 0 || searchCtrl.value === null || searchCtrl.value === '') {
  <router-outlet />
  } @else {
  <div class="product-listing">
    <div class="card-container">
      @for (item of products; track $index) {

      <div class="card">
        <img class="img-card" [src]="item?.thumbnail" alt="cover_image" (click)="onClick(item?._id)">
        <div [class.add-to-cart]="!counts[item._id] || counts[item._id] === 0"
          [class.cart]="counts[item._id] && counts[item._id] > 0">
          <ng-container *ngIf="!counts[item._id] || counts[item._id] === 0; else showControls">
            <i class="fa fa-cart-plus" aria-hidden="true" (click)="onCartClick(item._id)"></i>
          </ng-container>
          <ng-template #showControls>
            <i class="fa fa-minus" aria-hidden="true" [class.disabled]="counts[item._id] === 0"
              (click)="onMinus(item._id)" [style.pointer-events]="counts[item._id] === 0 ? 'none' : 'auto'"></i>
            <span class="count-item">{{ counts[item._id] }}</span>
            <i class="fa fa-add" aria-hidden="true" [class.disabled]="counts[item._id] === 0" (click)="onAdd(item._id)"
              [style.pointer-events]="counts[item._id] === 0 ? 'none' : 'auto'"></i>
          </ng-template>
        </div>
        <div [class.more-margin]="counts[item._id] && counts[item._id] > 0" class="detail" (click)="onClick(item?._id)">
          <strong>{{item.title}}</strong>
        </div>
      </div>
      }
    </div>
  </div>
  }
</div>
